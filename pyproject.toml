[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datasety"
dynamic = ["version"]
description = "CLI tool for dataset preparation: resize, align, caption, shuffle, synthetic, mask, filter, degrade, and character generation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "kontextox" }
]
keywords = [
    "dataset",
    "image-processing",
    "captioning",
    "florence-2",
    "synthetic",
    "image-editing",
    "diffusers",
    "machine-learning",
    "segmentation",
    "masking",
    "degradation",
    "upscaling",
    "character",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "huggingface_hub>=1.9.0",
]

[project.optional-dependencies]
caption = [
    "torch>=2.0.0",
    "transformers>=5.5.0",
    "einops",
    "timm",
    "numpy>=1.20.0",
]
synthetic = [
    "torch>=2.0.0",
    "diffusers>=0.37.1",
    "transformers>=5.5.0",
    "accelerate",
    "sentencepiece",
    "safetensors",
]
mask = [
    "torch>=2.0.0",
    "transformers>=5.5.0",
    "sam2>=1.0",
    "numpy>=1.20.0",
]
workflow = [
    "pyyaml>=6.0",
]
filter = [
    "torch>=2.0.0",
    "transformers>=5.5.0",
]
train = [
    "torch>=2.0.0",
    "diffusers>=0.37.1",
    "transformers>=5.5.0",
    "accelerate",
    "safetensors",
    "peft>=0.6.0",
]
degrade = []
character = [
    "torch>=2.0.0",
    "diffusers>=0.37.1",
    "transformers>=5.5.0",
    "accelerate",
    "safetensors",
]
audio = [
    "yt-dlp>=2026.3.17",
    "demucs>=4.0.1",
    "faster-whisper>=1.2.1",
    "soundfile>=0.13.1",
    "num2words>=0.5.14",
]
nemo = [
    "nemo-text-processing>=1.1.0",
]
audio-full = [
    "datasety[audio,nemo]",
]
upload =[
    "huggingface_hub>=1.9.0",
    "langdetect",
    "pyyaml>=6.0",
]
video = [
    "datasety[audio]",
]
all = [
    "datasety[caption,synthetic,mask,filter,degrade,character,train,workflow,audio-full,upload]",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
datasety = "datasety.cli:main"

[project.urls]
Homepage = "https://github.com/kontextox/datasety"
Repository = "https://github.com/kontextox/datasety"
Issues = "https://github.com/kontextox/datasety/issues"

[tool.hatch.version]
path = "src/datasety/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datasety"]

[tool.pytest.ini_options]
addopts = "-m 'not gpu'"
markers = [
    "gpu: tests that require loading heavy models (run with: pytest -m gpu)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/datasety/server.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
