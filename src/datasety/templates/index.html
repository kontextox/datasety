<!-- Stats page - dataset overview -->
{{ extra_styles }}
<style>
/* Stats-specific styles */
.stats-view{flex:1;overflow-y:auto;padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1100px}
.stat-card{background:var(--bg2);border:1px solid var(--border);padding:16px}
.stat-card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--fg2);margin-bottom:12px}
.stat-big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin-bottom:2px}
.stat-sub{font-size:12px;color:var(--fg2)}
.bar-row{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px}
.bar-lbl{min-width:76px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:5px;background:var(--bg3)}
.bar-fill{height:100%;background:var(--fg2)}
.bar-ct{min-width:36px;text-align:right;color:var(--fg2);font-variant-numeric:tabular-nums}
.stat-list{list-style:none;margin-top:4px}
.stat-list li{display:flex;justify-content:space-between;padding:3px 0;
  font-size:12px;border-bottom:1px solid var(--border)}
.stat-list li:last-child{border-bottom:none}
.stat-list .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.stat-list .val{color:var(--fg2);white-space:nowrap;padding-left:8px}
</style>
<div class="stats-view">
  <div class="stats-grid" id="stats-grid"></div>
</div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

async function loadStats(){
  await loadDatasetInfo();
  const sr=await api('/api/stats');
  const st=sr;

  let html='';

  // Total images
  html+=`<div class="stat-card">
    <div class="stat-card-title">Total Images</div>
    <div class="stat-big">${st.total||0}</div>
    <div class="stat-sub">${st.total_size_mb||0} MB</div>
  </div>`;

  // Captions
  const found=st.captions_found||0;
  const missing=st.captions_missing||0;
  const capPct=found+missing>0?Math.round(found/(found+missing)*100):0;
  html+=`<div class="stat-card">
    <div class="stat-card-title">Captions</div>
    <div class="stat-big">${found}/${found+missing}</div>
    <div class="bar-row"><div class="bar-track"><div class="bar-fill" style="width:${capPct}%"></div></div>
      <span class="bar-ct">${capPct}%</span></div>
  </div>`;

  // Formats
  if(st.formats&&Object.keys(st.formats).length){
    const total=Object.values(st.formats).reduce((a,b)=>a+b,0);
    html+=`<div class="stat-card">
      <div class="stat-card-title">Formats</div>
      <ul class="stat-list">`;
    for(const [fmt,ct] of Object.entries(st.formats)){
      const pct=Math.round(ct/total*100);
      html+=`<li><span class="lbl">.${fmt}</span><span class="val">${ct} (${pct}%)</span></li>`;
    }
    html+=`</ul></div>`;
  }

  // Orientations
  if(st.orientations&&Object.keys(st.orientations).length){
    const total=Object.values(st.orientations).reduce((a,b)=>a+b,0);
    html+=`<div class="stat-card">
      <div class="stat-card-title">Orientation</div>
      <ul class="stat-list">`;
    for(const [orient,ct] of Object.entries(st.orientations)){
      const pct=Math.round(ct/total*100);
      html+=`<li><span class="lbl">${orient}</span><span class="val">${ct} (${pct}%)</span></li>`;
    }
    html+=`</ul></div>`;
  }

  // Resolutions
  if(st.resolutions&&Object.keys(st.resolutions).length){
    const total=Object.values(st.resolutions).reduce((a,b)=>a+b,0);
    const sorted=Object.entries(st.resolutions).sort((a,b)=>b[1]-a[1]).slice(0,8);
    html+=`<div class="stat-card">
      <div class="stat-card-title">Resolutions</div>
      <ul class="stat-list">`;
    for(const [res,ct] of sorted){
      const pct=Math.round(ct/total*100);
      html+=`<li><span class="lbl">${res}</span><span class="val">${ct} (${pct}%)</span></li>`;
    }
    html+=`</ul></div>`;
  }

  $('stats-grid').innerHTML=html;
}

loadStats();
})();
</script>
