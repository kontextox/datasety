<!-- Audio dataset manager -->
<style>
/* Audio page layout */
.audio-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.audio-toolbar{display:flex;align-items:center;padding:6px 12px;gap:6px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.audio-toolbar .sp{flex:1}
.audio-toolbar .ctr{font-size:12px;color:var(--fg2);white-space:nowrap}

/* Audio file list */
.audio-list-wrap{flex:1;overflow-y:auto}
.audio-list{list-style:none}
.audio-item{display:flex;align-items:center;padding:6px 12px;gap:10px;
  cursor:pointer;border-bottom:1px solid var(--border);user-select:none;min-height:52px}
.audio-item:hover{background:var(--bg3)}
.audio-item.selected{background:var(--sel);color:var(--sel-fg)}
.audio-item.focused{outline:2px solid var(--fg);outline-offset:-2px}
.audio-item.playing{background:var(--bg3)}
.audio-item.playing.selected{background:var(--sel)}
.audio-chk{width:18px;height:18px;border:1px solid var(--border2);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  background:var(--bg);color:#fff;cursor:pointer}
.audio-item.selected .audio-chk{background:var(--sel);border-color:var(--sel)}
.audio-wave{width:60px;height:28px;flex-shrink:0;overflow:hidden;position:relative}
.audio-wave canvas{width:100%;height:100%}
.audio-info{flex:1;min-width:0;overflow:hidden}
.audio-name{font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.audio-meta{font-size:11px;color:var(--fg2);display:flex;gap:10px;margin-top:2px}
.audio-item.selected .audio-meta{color:rgba(255,255,255,.7)}
.audio-txt{width:14px;height:14px;flex-shrink:0;opacity:.6}
.audio-play-icon{width:24px;height:24px;flex-shrink:0;display:none;align-items:center;
  justify-content:center;font-size:14px;opacity:.8}

/* Playing state */
.audio-item.playing .audio-play-icon{display:flex}
.audio-item.playing .audio-txt{display:none}

/* Detail panel */
.detail{width:340px;flex-shrink:0;background:var(--bg2);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.detail.hidden{display:none}
.detail-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.detail-title{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.detail-close{font-size:16px;opacity:.6;cursor:pointer;padding:2px 6px}
.detail-close:hover{opacity:1}

/* Custom audio player */
.player{background:var(--bg);border-bottom:1px solid var(--border);padding:12px;
  flex-shrink:0}
.player-name{font-size:11px;color:var(--fg2);margin-bottom:8px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.waveform{height:60px;background:var(--bg3);position:relative;margin-bottom:8px;cursor:pointer}
.waveform canvas{width:100%;height:100%;display:block}
.waveform .progress{position:absolute;top:0;left:0;bottom:0;background:rgba(42,106,191,.25);
  pointer-events:none}
.waveform .playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--sel);
  pointer-events:none}
.player-ctrl{display:flex;align-items:center;gap:8px}
.player-ctrl .btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--sel);
  color:var(--sel-fg);font-size:16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;padding:0}
.player-ctrl .btn:hover{opacity:.85}
.player-ctrl .btn.seq{background:var(--bg3);color:var(--fg);font-size:12px;border:1px solid var(--border)}
.player-ctrl .btn.seq.active{background:var(--sel);color:var(--sel-fg);border-color:var(--sel)}
.player-time{font-size:11px;color:var(--fg2);font-variant-numeric:tabular-nums;
  min-width:80px;text-align:center}
.seek-bar{flex:1;height:4px;background:var(--bg3);cursor:pointer;position:relative}
.seek-bar input{width:100%;height:100%;opacity:0;position:absolute;top:0;left:0;cursor:pointer}
.seek-fill{height:100%;background:var(--sel);width:0%;pointer-events:none}

/* Transcription editor */
.detail-cap{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px;gap:6px;overflow:hidden}
.cap-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--fg2);flex-shrink:0}
.detail-cap textarea{flex:1;resize:none;padding:6px 8px;font-size:12px;line-height:1.5;
  min-height:80px;background:var(--bg);color:var(--fg);border:1px solid var(--border)}
.detail-cap textarea:focus{border-color:var(--sel);outline:none}
.txt-status{font-size:11px;color:var(--fg2);flex-shrink:0;display:flex;align-items:center;gap:4px}
.txt-status.missing{color:var(--danger)}

/* Actions */
.detail-actions{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-top:1px solid var(--border);flex-shrink:0}
.detail-actions .sp{flex:1}
.save-st{font-size:11px;color:var(--fg2)}

/* Stats sidebar */
.sb-stat{padding:6px 12px;border-bottom:1px solid var(--border)}
.sb-stat:last-child{border-bottom:none}
.sb-stat-lbl{font-size:10px;color:var(--fg3);text-transform:uppercase;letter-spacing:.05em}
.sb-stat-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:1px}

/* Seq playback indicator */
.seq-indicator{padding:4px 12px;background:var(--sel);color:var(--sel-fg);
  font-size:11px;font-weight:500;display:none;align-items:center;gap:6px;flex-shrink:0}
.seq-indicator.active{display:flex}
.seq-indicator .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Help modal extras */
.help-section{margin-bottom:16px}
.help-section h3{font-size:12px;font-weight:600;margin-bottom:6px;color:var(--fg)}
</style>

<div class="sidebar">
  <div class="sidebar-inner">
    <!-- Stats -->
    <div class="sb-section">
      <div class="sb-title">Statistics</div>

</div>

<div class="audio-area">
  <!-- Top toolbar -->
  <div class="audio-toolbar">
    <button id="btn-sel-all">Select all</button>
    <button id="btn-sel-none">Deselect</button>
    <span class="ctr" id="sel-ctr">0 selected</span>

    <span class="dot"></span>

  </div>
  <!-- Audio file list -->
  <div class="audio-list-wrap">
    <ul class="audio-list" id="audio-list"></ul>

</div>

<!-- Detail panel (initially hidden) -->
<div class="detail hidden" id="detail-panel">
  <div class="detail-hdr">
    <span class="detail-title" id="detail-title">—</span>
    <span class="detail-close" id="detail-close">×</span>
  </div>
  <!-- Player -->
  <div class="player">
    <div class="player-name" id="player-name">—</div>
    <div class="waveform" id="waveform">
      <canvas id="wave-canvas"></canvas>
      <div class="progress" id="wave-progress"></div>
      <div class="playhead" id="wave-playhead"></div>
    </div>
    <div class="player-ctrl">
      <button class="btn" id="btn-play" title="Play/Pause (Space)">&#9654;</button>

      </div>

    <button id="btn-save" class="primary">Save</button>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let audioData = [];
let selectedPaths = new Set();
let lastClickedIdx = -1;
let focusedIdx = -1;
let filterTxt = null;
let sortBy = 'name';
let sortAsc = true;

let audioEl = null;          // hidden <audio> element
let currentIdx = -1;         // index in audioData (not filtered)
let seqMode = false;         // sequential playback mode
let seqPaused = false;        // true when space was pressed during seq
let saveTimer = null;
let saveDirty = false;
let drawnWaveform = null;    // cached waveform bars
let _lastClickTime = 0;

// ─── Init ────────────────────────────────────────────────────────────────────
async function init() {
  await loadDatasetInfo();
  await loadAudio();
  setupKeyboard();

  document.getElementById('btn-sel-all').addEventListener('click', selectAll);
  document.getElementById('btn-sel-none').addEventListener('click', deselectAll);
  document.getElementById('btn-delete').addEventListener('click', deleteSelected);
  document.getElementById('btn-seq').addEventListener('click', startSeq);
  document.getElementById('btn-seq-stop').addEventListener('click', stopSeq);
  document.getElementById('btn-seq-single').addEventListener('click', startSeqFromCurrent);
  document.getElementById('sel-sort').addEventListener('change', e => { sortBy = e.target.value; loadAudio(); });
  document.getElementById('sel-order').addEventListener('change', e => { sortAsc = e.target.value === 'asc'; loadAudio(); });
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('btn-prev').addEventListener('click', prevAudio);
  document.getElementById('btn-next').addEventListener('click', nextAudio);
  document.getElementById('btn-play').addEventListener('click', togglePlay);
  document.getElementById('btn-save').addEventListener('click', saveTranscription);
  document.getElementById('txt-editor').addEventListener('input', () => { saveDirty = true; scheduleSave(); });

  // Filter clicks
  document.querySelectorAll('.sb-item[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      filterTxt = el.dataset.filter === '' ? null : el.dataset.filter === 'true';
      document.querySelectorAll('.sb-item[data-filter]').forEach(x => x.classList.remove('active'));
      el.classList.add('active');
      applyFilter();
    });
  });

  // Setup audio element
  audioEl = new Audio();
  audioEl.addEventListener('timeupdate', onTimeUpdate);
  audioEl.addEventListener('ended', onAudioEnded);
  audioEl.addEventListener('loadedmetadata', onMeta);
  audioEl.addEventListener('error', () => {
    document.getElementById('player-time').textContent = 'Error loading audio';
  });
  audioEl.addEventListener('canplay', () => {
    if (audioEl._pendingPlay) {
      audioEl._pendingPlay = false;
      audioEl.play().catch(() => {});
      updatePlayBtn();
    }
  });

  // Waveform click to seek
  const waveform = document.getElementById('waveform');
  waveform.addEventListener('click', e => {
    if (!audioEl.duration) return;
    const rect = waveform.getBoundingClientRect();
    audioEl.currentTime = (e.clientX - rect.left) / rect.width * audioEl.duration;
  });

  // Seek input
  document.getElementById('seek-input').addEventListener('input', e => {
    if (!audioEl.duration) return;
    audioEl.currentTime = e.target.value / 100 * audioEl.duration;
  });
}

// ─── Load audio ───────────────────────────────────────────────────────────────
async function loadAudio() {
  const params = new URLSearchParams();
  if (filterTxt !== null) params.set('has_transcription', filterTxt);
  params.set('sort', sortBy);
  params.set('order', sortAsc ? 'asc' : 'desc');
  const { audio, total } = await api(`/api/audio?${params}`);
  audioData = audio;
  renderList();
  updateStats();
}

async function loadStats() {
  const stats = await api('/api/audio/stats');
  document.getElementById('st-total').textContent = stats.total;
  document.getElementById('st-dur').textContent = fmtDuration(stats.total_duration_s);
  document.getElementById('st-size').textContent = stats.total_size_mb + ' MB';
  document.getElementById('st-has-txt').textContent = stats.transcriptions_found;
  document.getElementById('st-miss-txt').textContent = stats.transcriptions_missing;
  document.getElementById('ct-all').textContent = stats.total;
  document.getElementById('ct-txt').textContent = stats.transcriptions_found;
  document.getElementById('ct-no-txt').textContent = stats.transcriptions_missing;
}

function updateStats() { loadStats(); }

function applyFilter() { loadAudio(); }

// ─── Render list ──────────────────────────────────────────────────────────────
function renderList() {
  const list = document.getElementById('audio-list');
  if (!audioData.length) {
    list.innerHTML = '<li class="empty" style="list-style:none;padding:40px;text-align:center;color:var(--fg2)">No audio files found</li>';
    return;
  }
  list.innerHTML = '';
  audioData.forEach((item, i) => {
    const li = document.createElement('li');
    li.className = 'audio-item';
    li.dataset.idx = i;
    if (selectedPaths.has(item.path)) li.classList.add('selected');
    if (i === currentIdx && seqMode) li.classList.add('playing');
    if (i === focusedIdx) li.classList.add('focused');

    const chk = selectedPaths.has(item.path) ? '&#10003;' : '';
    const dur = item.duration ? fmtTime(item.duration) : '—';
    const txtIcon = item.has_transcription
      ? '<svg class="audio-txt" viewBox="0 0 16 16" fill="currentColor"><text x="1" y="12" font-size="12" font-family="sans-serif">T</text></svg>'
      : '<svg class="audio-txt" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="3" y1="3" x2="13" y2="13"/><line x1="13" y1="3" x2="3" y2="13"/></svg>';

    li.innerHTML = `
      <div class="audio-chk">${chk}</div>
      <div class="audio-wave"><canvas width="60" height="28" id="wc-${i}"></canvas></div>
      <div class="audio-info">
        <div class="audio-name">${escHtml(item.name)}</div>
        <div class="audio-meta">
          <span>${dur}</span>
          <span>${item.size_kb} KB</span>
          ${item.has_transcription ? '<span style="color:#4a4">&#10003; txt</span>' : '<span style="color:var(--danger)">no txt</span>'}
        </div>
      </div>
      <div class="audio-play-icon">&#9654;</div>
      ${txtIcon}
    `;

    // Click handlers
    li.addEventListener('click', e => onItemClick(e, i));
    li.addEventListener('dblclick', () => openDetail(i));

    list.appendChild(li);

    // Draw mini waveform asynchronously
    drawMiniWave(i, item);
  });
  updateSelCtr();
}

function drawMiniWave(idx, item) {
  const canvas = document.getElementById(`wc-${idx}`);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  // Use cached or generate pseudo waveform
  const bars = 30;
  const barW = 1.5;
  const gap = (W - bars * barW) / (bars + 1);
  ctx.fillStyle = 'var(--fg3)';
  for (let b = 0; b < bars; b++) {
    // Deterministic pseudo-random height based on name
    let seed = 0;
    for (let c of item.name) seed = (seed * 31 + c.charCodeAt(0)) & 0xffff;
    const h = ((seed * (b * 7 + 11)) & 0xffff) / 0xffff;
    const barH = Math.max(2, h * H * 0.8);
    const x = gap + b * (barW + gap);
    const y = (H - barH) / 2;
    ctx.fillRect(x, y, barW, barH);
  }
}

// ─── Item click / select ──────────────────────────────────────────────────────
function onItemClick(e, idx) {
  const now = Date.now();

  // Detect double-click (within 300ms)
  if (now - _lastClickTime < 300) {
    _lastClickTime = 0;
    // Double-click — open detail
    openDetail(idx);
    return;
  }

  _lastClickTime = now;

  if (e.shiftKey && lastClickedIdx >= 0) {
    // Range select
    const start = Math.min(lastClickedIdx, idx);
    const end = Math.max(lastClickedIdx, idx);
    for (let i = start; i <= end; i++) selectedPaths.add(audioData[i].path);
  } else if (e.ctrlKey || e.metaKey) {
    // Toggle
    if (selectedPaths.has(audioData[idx].path)) selectedPaths.delete(audioData[idx].path);
    else selectedPaths.add(audioData[idx].path);
  } else {
    // Single click — toggle selection (detail panel stays as-is)
    const item = audioData[idx];
    if (selectedPaths.has(item.path)) selectedPaths.delete(item.path);
    else selectedPaths.add(item.path);
  }
  lastClickedIdx = idx;
  renderList();
}

function selectAll() {
  audioData.forEach(a => selectedPaths.add(a.path));
  renderList();
}

function deselectAll() {
  selectedPaths.clear();
  lastClickedIdx = -1;
  renderList();
}

function updateSelCtr() {
  const n = selectedPaths.size;
  document.getElementById('sel-ctr').textContent = `${n} selected`;
  document.getElementById('btn-delete').disabled = n === 0;
}

// ─── Detail panel ─────────────────────────────────────────────────────────────
function openDetail(idx) {
  focusedIdx = idx;
  currentIdx = idx;
  const item = audioData[idx];
  document.getElementById('detail-panel').classList.remove('hidden');
  document.getElementById('detail-title').textContent = item.name;
  document.getElementById('player-name').textContent = item.name;
  document.getElementById('txt-editor').value = item.transcription || '';
  document.getElementById('txt-status').textContent = item.has_transcription ? 'Transcription file present' : 'No file — edit to create';
  document.getElementById('txt-status').className = 'txt-status' + (item.has_transcription ? '' : ' missing');
  document.getElementById('save-st').textContent = '';
  saveDirty = false;

  // Load audio
  audioEl._pendingPlay = false;
  audioEl.src = `/api/audio/file?path=${encodeURIComponent(item.path)}`;
  audioEl.load();
  document.getElementById('player-time').textContent = 'Loading…';
  updatePlayingItem();
  renderList();
  document.getElementById('txt-editor').focus();
}

function closeDetail() {
  focusedIdx = -1;
  document.getElementById('detail-panel').classList.add('hidden');
  stopSeq();
  if (audioEl) { audioEl.pause(); audioEl.src = ''; }
  currentIdx = -1;
  renderList();
}

function prevAudio() {
  if (focusedIdx > 0) openDetail(focusedIdx - 1);
}

function nextAudio() {
  if (focusedIdx < audioData.length - 1) openDetail(focusedIdx + 1);
}

function updatePlayingItem() {
  document.querySelectorAll('.audio-item').forEach((el, i) => {
    el.classList.toggle('playing', i === currentIdx && seqMode);
  });
}

// ─── Playback ─────────────────────────────────────────────────────────────────
function togglePlay() {
  if (!audioEl.src) return;
  if (audioEl.paused) {
    if (audioEl.readyState >= 3) {
      audioEl.play().catch(() => {});
    } else {
      audioEl._pendingPlay = true;
    }
  } else {
    audioEl.pause();
  }
  updatePlayBtn();
}

function updatePlayBtn() {
  const btn = document.getElementById('btn-play');
  if (!btn) return;
  btn.innerHTML = audioEl.paused ? '&#9654;' : '&#10074;&#10074;';
}

function onTimeUpdate() {
  if (!audioEl.duration) return;
  const pct = audioEl.currentTime / audioEl.duration * 100;
  document.getElementById('seek-fill').style.width = pct + '%';
  document.getElementById('seek-input').value = pct;
  document.getElementById('wave-progress').style.width = pct + '%';
  document.getElementById('wave-playhead').style.left = pct + '%';
  document.getElementById('player-time').textContent = `${fmtTime(audioEl.currentTime)} / ${fmtTime(audioEl.duration)}`;
  updatePlayBtn();

  // Draw playhead on waveform
  const playhead = document.getElementById('wave-playhead');
  playhead.style.display = 'block';
}

function onMeta() {
  document.getElementById('player-time').textContent = `0:00 / ${fmtTime(audioEl.duration)}`;
  updatePlayBtn();
  drawWaveform();
}

function onAudioEnded() {
  updatePlayBtn();
  if (seqMode && !seqPaused) {
    // Auto-advance
    if (focusedIdx < audioData.length - 1) {
      openDetail(focusedIdx + 1);
      audioEl.play().catch(() => {});
    } else {
      // End of sequence
      stopSeq();
    }
  }
}

function drawWaveform() {
  if (!audioEl.buffered || audioEl.buffered.length === 0) return;
  const canvas = document.getElementById('wave-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width = canvas.parentElement.clientWidth || 300;
  const H = canvas.height = 60;
  ctx.clearRect(0, 0, W, H);

  // Try to get audio data for waveform
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const reader = new FileReader();
    reader.onload = e => {
      audioCtx.decodeAudioData(e.target.result, buf => {
        const data = buf.getChannelData(0);
        const step = Math.ceil(data.length / W);
        ctx.fillStyle = 'var(--fg3)';
        for (let i = 0; i < W; i++) {
          let min = 1, max = -1;
          for (let j = 0; j < step; j++) {
            const d = data[i * step + j] || 0;
            if (d < min) min = d;
            if (d > max) max = d;
          }
          const h = Math.max(2, (max - min) / 2 * H);
          ctx.fillRect(i, (H - h) / 2, 1, h);
        }
      });
    };
    reader.readAsArrayBuffer(audioEl.src);
  } catch {}
}

// ─── Sequential playback ───────────────────────────────────────────────────────
function startSeq() {
  if (!audioData.length) return;
  seqMode = true;
  seqPaused = false;
  document.getElementById('seq-indicator').classList.add('active');
  document.getElementById('btn-seq').classList.add('active');
  document.getElementById('seq-label').textContent = focusedIdx >= 0
    ? `Playing from: ${audioData[focusedIdx].name}`
    : 'Playing all';
  if (focusedIdx < 0) openDetail(0);
  if (audioEl.readyState >= 3) {
    audioEl.play().catch(() => {});
  } else {
    audioEl._pendingPlay = true;
  }
  updatePlayBtn();
}

function startSeqFromCurrent() {
  if (focusedIdx < 0) return;
  // If already at last item, restart current; otherwise advance to next
  if (focusedIdx >= audioData.length - 1) {
    audioEl.currentTime = 0;
    seqMode = true;
    seqPaused = false;
    document.getElementById('seq-indicator').classList.add('active');
    document.getElementById('seq-label').textContent = `Replay: ${audioData[focusedIdx].name}`;
    if (audioEl.readyState >= 3) audioEl.play().catch(() => {});
    else audioEl._pendingPlay = true;
    updatePlayBtn();
    return;
  }
  // Advance to next item and play it
  const nextIdx = focusedIdx + 1;
  openDetail(nextIdx);
  seqMode = true;
  seqPaused = false;
  document.getElementById('seq-indicator').classList.add('active');
  document.getElementById('seq-label').textContent = `Playing from: ${audioData[nextIdx].name}`;
  // After openDetail loads new audio, set flag so canplay fires play
  audioEl._pendingPlay = true;
  updatePlayBtn();
}

function stopSeq() {
  seqMode = false;
  seqPaused = false;
  document.getElementById('seq-indicator').classList.remove('active');
  document.getElementById('btn-seq').classList.remove('active');
  if (audioEl) audioEl.pause();
  updatePlayBtn();
  updatePlayingItem();
}

// ─── Transcription save ──────────────────────────────────────────────────────
function scheduleSave() {
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    if (saveDirty) saveTranscription();
  }, 2000);
}

async function saveTranscription() {
  if (focusedIdx < 0) return;
  const item = audioData[focusedIdx];
  const text = document.getElementById('txt-editor').value;
  saveDirty = false;
  if (saveTimer) clearTimeout(saveTimer);
  try {
    await api('/api/audio/transcription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: item.path, text }),
    });
    document.getElementById('save-st').textContent = 'Saved';
    setTimeout(() => { const el = document.getElementById('save-st'); if (el) el.textContent = ''; }, 2000);
    item.transcription = text;
    item.has_transcription = !!text.trim();
    renderList();
  } catch {
    document.getElementById('save-st').textContent = 'Save failed';
  }
}

// ─── Delete ───────────────────────────────────────────────────────────────────
async function deleteSelected() {
  const paths = [...selectedPaths];
  if (!paths.length) return;
  if (!confirm(`Delete ${paths.length} file(s) and their transcriptions? This cannot be undone.`)) return;
  try {
    const { count } = await api('/api/audio/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ paths }),
    });
    selectedPaths.clear();
    lastClickedIdx = -1;
    closeDetail();
    await loadAudio();
  } catch {
    alert('Delete failed');
  }
}

// ─── Keyboard shortcuts ───────────────────────────────────────────────────────
function setupKeyboard() {
  document.addEventListener('keydown', e => {
    const tag = e.target.tagName;
    const inInput = tag === 'INPUT' || tag === 'TEXTAREA';

    // Escape — close detail / deselect
    if (e.key === 'Escape') {
      if (document.querySelector('.overlay')) return;
      if (!document.getElementById('detail-panel').classList.contains('hidden')) {
        closeDetail();
        return;
      }
      deselectAll();
      return;
    }

    if (inInput) return;

    // ? — help
    if (e.key === '?') {
      e.preventDefault();
      showAudioHelp();
      return;
    }

    // Space — play/pause (or pause seq)
    if (e.key === ' ') {
      e.preventDefault();
      if (seqMode) {
        if (audioEl.paused) {
          audioEl.play().catch(() => {});
          seqPaused = false;
        } else {
          audioEl.pause();
          seqPaused = true;
          // Focus transcription editor
          document.getElementById('txt-editor').focus();
        }
      } else if (focusedIdx >= 0) {
        togglePlay();
      }
      return;
    }

    // P — toggle sequential playback
    if (e.key === 'p' || e.key === 'P') {
      if (seqMode) stopSeq();
      else startSeq();
      return;
    }

    // Shift+Space — play from here (seq)
    if (e.shiftKey && e.key === ' ') {
      e.preventDefault();
      if (focusedIdx >= 0) startSeqFromCurrent();
      return;
    }

    // Arrow keys — navigate / seek
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      if (focusedIdx >= 0 && audioEl.duration) {
        audioEl.currentTime = Math.max(0, audioEl.currentTime - (e.shiftKey ? 30 : 5));
      } else if (focusedIdx > 0) {
        openDetail(focusedIdx - 1);
      }
      return;
    }
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      if (focusedIdx >= 0 && audioEl.duration) {
        audioEl.currentTime = Math.min(audioEl.duration, audioEl.currentTime + (e.shiftKey ? 30 : 5));
      } else if (focusedIdx < audioData.length - 1) {
        openDetail(focusedIdx + 1);
      }
      return;
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (focusedIdx > 0) openDetail(focusedIdx - 1);
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (focusedIdx < audioData.length - 1) openDetail(focusedIdx + 1);
      return;
    }

    // Enter — open detail for focused
    if (e.key === 'Enter' && focusedIdx >= 0) {
      // Already open
      return;
    }

    // Ctrl/Cmd+A — select all
    if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
      e.preventDefault();
      selectAll();
      return;
    }

    // Ctrl/Cmd+Shift+A — deselect all
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key === 'A') {
      e.preventDefault();
      deselectAll();
      return;
    }

    // Ctrl/Cmd+S — save
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveTranscription();
      return;
    }

    // Delete — delete selected
    if (e.key === 'Delete' && selectedPaths.size > 0) {
      e.preventDefault();
      deleteSelected();
      return;
    }
  });
}

// ─── Utilities ───────────────────────────────────────────────────────────────
function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function fmtDuration(s) {
  if (!s) return '—';
  if (s < 60) return `${Math.round(s)}s`;
  if (s < 3600) return `${Math.round(s / 60)}m`;
  return `${(s / 3600).toFixed(1)}h`;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
