<!-- Run page - execute datasety commands -->
<style>
.run-main{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.run-form-wrap{flex:0 0 auto;overflow-y:auto;max-height:420px;border-bottom:1px solid var(--border)}
.run-form{padding:14px 16px 8px}
.run-form h3{font-size:13px;font-weight:600;margin-bottom:3px}
.run-form-desc{font-size:11px;color:var(--fg2);margin-bottom:12px;line-height:1.4}
.run-field{display:grid;grid-template-columns:138px 1fr;align-items:center;margin-bottom:8px;gap:8px;font-size:12px}
.run-field label{color:var(--fg2)}.run-field .req{color:var(--danger)}
.run-field input[type="text"],.run-field select{width:100%;padding:5px 8px}
.run-field input[type="checkbox"]{cursor:pointer;margin:0}
.run-actions{padding:8px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:var(--bg2);flex-shrink:0}
.run-err{font-size:11px;color:var(--danger);flex:1}
.run-out-section{flex:1;display:flex;flex-direction:column;min-height:0}
.run-out-hdr{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;font-size:12px}
.run-out{flex:1;overflow-y:auto;padding:10px 12px;font-family:SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:11px;line-height:1.6;background:var(--bg);white-space:pre-wrap;min-height:0}
.run-job-item{display:flex;align-items:center;gap:6px;padding:4px 12px;font-size:11px;cursor:pointer;user-select:none}
.run-job-item:hover{background:var(--bg3)}.run-job-item.active{background:var(--sel);color:var(--sel-fg)}
.run-job-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jst{width:7px;height:7px;flex-shrink:0}
.jst.running{background:#fa0}.jst.done{background:#4a4}.jst.failed,.jst.cancelled{background:var(--danger)}
.job-status{font-size:11px;font-weight:600}
.job-status.running{color:#fa0}.job-status.done{color:#4a4}.job-status.failed,.job-status.cancelled{color:var(--danger)}
</style>
<div class="sidebar">
  <div class="sidebar-inner">
    <div class="sb-section">
      <div class="sb-title">Commands</div>
      <div id="run-cmd-list"></div>
    </div>
    <div class="sb-section">
      <div class="sb-title">Recent Jobs</div>
      <div id="run-job-list"><div style="padding:8px 12px;font-size:11px;color:var(--fg2)">No jobs yet</div></div>
    </div>
  </div>
</div>
<div class="run-main">
  <div class="run-form-wrap" id="run-form-wrap">
    <div style="display:flex;align-items:center;justify-content:center;padding:40px;color:var(--fg2);font-size:12px" id="run-form-empty">Select a command</div>
    <div id="run-form-inner" class="hidden"></div>
  </div>
  <div class="run-out-section">
    <div class="run-out-hdr hidden" id="run-out-hdr">
      <span id="run-out-cmd" style="font-weight:600"></span>
      <span class="job-status" id="run-out-st"></span>
      <div style="flex:1"></div>
      <button class="danger hidden" id="btn-run-cancel">Cancel</button>
      <button id="btn-run-clear">Clear</button>
    </div>
    <div class="run-out hidden" id="run-out"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const on=(el,ev,fn,opts)=>el.addEventListener(ev,fn,opts);

let commands={};
let runCmd=null;
let pollJobId=null;
let pollTimer=null;
let outLen=0;

async function loadCommands(){
  await loadDatasetInfo();
  try{commands=await api('/api/commands')}catch{commands={}}
  const list=$('run-cmd-list');
  list.innerHTML=Object.keys(commands).map(cmd=>`<div class="run-job-item" data-cmd="${cmd}">${cmd}</div>`).join('');
  list.querySelectorAll('.run-job-item').forEach(el=>{
    on(el,'click',()=>{selectCommand(el.dataset.cmd)});
  });
}

function selectCommand(cmd){
  if(!commands[cmd])return;
  runCmd=cmd;
  const schema=commands[cmd];
  $('run-form-empty').classList.add('hidden');
  const inner=$('run-form-inner');
  inner.classList.remove('hidden');
  let html=`<div class="run-form"><h3>${cmd}</h3>`;
  if(schema.description)html+=`<div class="run-form-desc">${schema.description}</div>`;
  for(const arg of schema.args||[]){
    const req=arg.required?'<span class="req">*</span>':'';
    if(arg.type==='bool'){
      html+=`<div class="run-field" style="grid-template-columns:1fr">
        <label><input type="checkbox" id="arg-${arg.id}">${arg.label}</label>
      </div>`;
    }else{
      html+=`<div class="run-field"><label>${arg.label}${req}</label>`;
      if(arg.type==='select'){
        const opts=[arg.default?'':'',...arg.options||[]].filter(Boolean);
        const uniqueOpts=[...new Set(opts)];
        html+=`<select id="arg-${arg.id}">${uniqueOpts.map(o=>`<option value="${o}">${o||'(default)'}</option>`).join('')}</select>`;
      }else{
        const ph=arg.placeholder||'';
        html+=`<input type="text" id="arg-${arg.id}" placeholder="${ph}">`;
      }
      html+=`</div>`;
    }
  }
  html+=`</div><div class="run-actions">
    <span class="run-err" id="run-err"></span>
    <button class="primary" id="btn-run">Run</button>
  </div>`;
  inner.innerHTML=html;
  on($('btn-run'),'click',runCommand);
  list.querySelectorAll('.run-job-item').forEach(el=>el.classList.toggle('active',el.dataset.cmd===cmd));
}

async function runCommand(){
  if(!runCmd)return;
  const schema=commands[runCmd];
  const args={};
  for(const arg of schema.args||[]){
    const el=$('arg-'+arg.id);
    if(arg.type==='bool')args[arg.id]=el.checked;
    else if(el.value)args[arg.id]=el.value;
  }
  $('run-err').textContent='';
  try{
    const res=await api('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({command:runCmd,args})});
    pollJobId=res.job_id;
    outLen=0;
    clearTimeout(pollTimer);
    $('run-out-hdr').classList.remove('hidden');
    $('run-out').classList.remove('hidden');
    $('run-out-cmd').textContent=runCmd;
    pollRunJob();
  }catch(e){
    $('run-err').textContent=e.message||'Failed to start command';
  }
}

async function pollRunJob(){
  if(!pollJobId)return;
  try{
    const j=await api('/api/job?id='+pollJobId);
    $('run-out-st').textContent=j.status;
    $('run-out-st').className='job-status '+j.status;
    $('btn-run-cancel').classList.toggle('hidden',j.status!=='running');
    if(j.output&&j.output.length>outLen){
      $('run-out').textContent=j.output.join('\n');
      outLen=j.output.length;
      $('run-out').scrollTop=$('run-out').scrollHeight;
    }
    if(j.status==='running'){
      pollTimer=setTimeout(pollRunJob,500);
    }else{
      loadRunJobs();
    }
  }catch{}
}

async function loadRunJobs(){
  try{
    const res=await api('/api/jobs');
    const jobs=res.jobs||[];
    const el=$('run-job-list');
    if(!jobs.length){el.innerHTML='<div style="padding:8px 12px;font-size:11px;color:var(--fg2)">No jobs yet</div>';return}
    el.innerHTML=jobs.map(j=>`<div class="run-job-item${pollJobId===j.id?' active':''}" data-jid="${j.id}">
      <div class="jst ${j.status}"></div>
      <span class="run-job-name">${j.command}</span>
      <span style="font-size:10px;color:var(--fg3)">${j.status}</span>
    </div>`).join('');
    el.querySelectorAll('.run-job-item').forEach(b=>{
      on(b,'click',async()=>{
        pollJobId=b.dataset.jid;outLen=0;clearTimeout(pollTimer);
        $('run-out-hdr').classList.remove('hidden');$('run-out').classList.remove('hidden');
        const j=await api('/api/job?id='+b.dataset.jid);
        $('run-out-cmd').textContent=j.command;
        $('run-out-st').textContent=j.status;$('run-out-st').className='job-status '+j.status;
        $('run-out').textContent=(j.output||[]).join('\n');
        outLen=(j.output||[]).length;
        $('btn-run-cancel').classList.toggle('hidden',j.status!=='running');
        if(j.status==='running')pollTimer=setTimeout(pollRunJob,500);
        loadRunJobs(jobs);
      });
    });
  }catch{}
}

on($('btn-run-cancel'),'click',async()=>{
  if(!pollJobId)return;
  clearTimeout(pollTimer);
  await api('/api/job/cancel',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:pollJobId})});
  const j=await api('/api/job?id='+pollJobId);
  $('run-out-st').textContent=j.status;$('run-out-st').className='job-status '+j.status;
  $('btn-run-cancel').classList.add('hidden');
  loadRunJobs();
});

on($('btn-run-clear'),'click',()=>{
  clearTimeout(pollTimer);pollJobId=null;outLen=0;
  $('run-out-hdr').classList.add('hidden');$('run-out').classList.add('hidden');
  $('run-out').textContent='';
});

loadCommands();
loadRunJobs();
})();
</script>
