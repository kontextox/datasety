<!-- Gallery page - image browser -->
<style>
/* Gallery-specific styles */
.gal-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.toolbar{display:flex;align-items:center;padding:6px 12px;gap:6px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.toolbar .sp{flex:1}
.ctr{font-size:12px;color:var(--fg2);white-space:nowrap}
.gal-wrap{flex:1;overflow-y:auto;padding:10px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:3px}
.thumb{position:relative;aspect-ratio:1;background:var(--thumb-bg);
  cursor:pointer;overflow:hidden;border:2px solid transparent;user-select:none}
.thumb:hover{border-color:var(--fg2)}.thumb.selected{border-color:var(--sel)}
.thumb.focused{border-color:var(--fg);outline:1px solid var(--fg);outline-offset:-1px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.thumb-name{position:absolute;bottom:0;left:0;right:0;padding:3px 5px;
  background:rgba(0,0,0,.6);color:#fff;font-size:10px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb-cap{position:absolute;top:3px;right:3px;font-size:9px;padding:1px 4px;
  background:rgba(160,50,50,.85);color:#fff}
.thumb-chk{position:absolute;top:3px;left:3px;width:16px;height:16px;
  border:1px solid rgba(255,255,255,.8);background:rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff}
.thumb.selected .thumb-chk{background:var(--sel)}

/* Detail panel */
.detail{width:300px;flex-shrink:0;background:var(--bg2);
  border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.detail.hidden{display:none}
.detail-hdr{display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid var(--border);flex-shrink:0;gap:8px}
.detail-title{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-prev{background:var(--bg);border-bottom:1px solid var(--border);height:220px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.detail-prev img{max-width:100%;max-height:100%;object-fit:contain}
.detail-meta{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
.meta-row{display:flex;justify-content:space-between;padding:2px 0;font-size:11px}
.meta-lbl{color:var(--fg2)}.meta-val{font-variant-numeric:tabular-nums}
.detail-cap{flex:1;display:flex;flex-direction:column;min-height:0;padding:10px 12px;gap:6px}
.cap-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--fg2)}
.detail-cap textarea{flex:1;resize:none;padding:6px 8px;font-size:12px;line-height:1.5;
  min-height:60px;background:var(--bg);color:var(--fg);border:1px solid var(--border)}
.detail-actions{display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-top:1px solid var(--border);flex-shrink:0}
.save-st{font-size:11px;color:var(--fg2);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
</style>
<div class="sidebar"><div class="sidebar-inner" id="sidebar"></div></div>
<div class="gal-area">
  <div class="toolbar">
    <button id="btn-sel-all">Select all</button>
    <button id="btn-desel" class="hidden">Deselect</button>
    <button id="btn-del-sel" class="danger hidden">Delete (<span id="sel-ct">0</span>)</button>
    <button id="btn-cmp-sel" class="hidden">Compare 2</button>
    <div class="sp"></div>
    <span class="ctr" id="ctr">&#8212;</span>
    <select id="sort-by">
      <option value="name">Name</option>
      <option value="size">Size</option>
      <option value="resolution">Resolution</option>
      <option value="format">Format</option>
    </select>
    <button id="btn-sort-dir" title="Sort direction">&#8593;</button>
  </div>
  <div class="gal-wrap" id="gal-wrap">
    <div class="gal-grid" id="grid"></div>
    <div class="empty hidden" id="gal-empty">No images match the current filters.</div>
  </div>
</div>
<div class="detail hidden" id="detail">
  <div class="detail-hdr">
    <span class="detail-title" id="det-title"></span>
    <button class="icon" id="btn-close-det">&times;</button>
  </div>
  <div class="detail-prev"><img id="det-img" draggable="false"></div>
  <div class="detail-meta" id="det-meta"></div>
  <div class="detail-cap">
    <div class="cap-lbl">Caption</div>
    <textarea id="cap-text" placeholder="No caption &#x2014; start typing to create one"></textarea>
  </div>
  <div class="detail-actions">
    <span class="save-st" id="save-st"></span>
    <button id="btn-save" title="Save (Ctrl+S)">Save</button>
    <button id="btn-cmp-det" title="Use in Compare">Compare</button>
    <button id="btn-del-det" class="danger" title="Delete">Delete</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const on=(el,ev,fn,opts)=>el.addEventListener(ev,fn,opts);

// State
const S={
  images:[],filtered:[],stats:{},
  selected:new Set(),activeImg:null,
  filters:{format:null,orientation:null,resolution:null,hasCaption:null},
  sort:{by:'name',dir:'asc'},
  search:'',focusIdx:-1,
  cmpA:null,cmpB:null,pickingFor:null,
};

// Load data
async function loadAll(){
  console.log('[gallery] loadAll start');
  try{
    const di=await loadDatasetInfo();
    console.log('[gallery] datasetInfo:',di);
  }catch(e){console.error('loadDatasetInfo failed:',e)}
  let ir={images:[]},sr={};
  try{
    [ir,sr]=await Promise.all([api('/api/images'),api('/api/stats')]);
    console.log('[gallery] /api/images response:',ir,'total images:',Array.isArray(ir.images)?ir.images.length:'NOT_ARRAY');
  }catch(e){console.error('API load failed:',e)}
  S.images=Array.isArray(ir.images)?ir.images:[];
  if(S.images.length===0&&ir.images&&typeof ir.images==='object'){
    console.log('[gallery] images not array, treating as object');
  }
  S.stats=sr||{};
  console.log('[gallery] S.images length:',S.images.length,'S.stats:',S.stats);
  try{applyFilters();renderSidebar()}catch(e){console.error('render failed:',e)}
  console.log('[gallery] loadAll done, filtered:',S.filtered.length);
}

// Filters
function applyFilters(){
  let imgs=S.images;
  if(S.filters.format)imgs=imgs.filter(i=>i.format===S.filters.format);
  if(S.filters.orientation)imgs=imgs.filter(i=>i.orientation===S.filters.orientation);
  if(S.filters.resolution)imgs=imgs.filter(i=>i.resolution===S.filters.resolution);
  if(S.filters.hasCaption!==null)imgs=imgs.filter(i=>i.has_caption===S.filters.hasCaption);
  if(S.search){
    const q=S.search.toLowerCase();
    imgs=imgs.filter(i=>i.name.toLowerCase().includes(q)||(i.caption||'').toLowerCase().includes(q));
  }
  const rev=S.sort.dir==='desc';
  const kf={size:i=>i.size_bytes||0,resolution:i=>(i.width||0)*(i.height||0),format:i=>i.format||''};
  imgs=[...imgs].sort((a,b)=>{
    const ka=kf[S.sort.by]||((i)=>i.name||'');
    const va=ka(a),vb=ka(b);
    return va<vb?(rev?1:-1):va>vb?(rev?-1:1):0;
  });
  S.filtered=imgs;renderGrid();updateCtr();
}

function renderSidebar(){
  const st=S.stats,total=S.images.length;
  let html='';
  function section(title,items,key){
    html+=`<div class="sb-section"><div class="sb-title">${title}</div>`;
    const aa=S.filters[key]===null?' active':'';
    html+=`<div class="sb-item${aa}" data-k="${key}" data-v="__all__"><span>All</span><span class="ct">${total}</span></div>`;
    items.forEach(([label,val,ct])=>{
      const ac=S.filters[key]===val?' active':'';
      html+=`<div class="sb-item${ac}" data-k="${key}" data-v="${val}"><span>${label}</span><span class="ct">${ct}</span></div>`;
    });
    html+='</div>';
  }
  if(st.formats)section('Format',Object.entries(st.formats).map(([f,c])=>[`.${f}`,f,c]),'format');
  if(st.orientations)section('Orientation',Object.entries(st.orientations).map(([o,c])=>[o,o,c]),'orientation');
  if(st.resolutions)section('Resolution',Object.entries(st.resolutions).map(([r,c])=>[r,r,c]).slice(0,10),'resolution');
  if(st.captions_found+st.captions_missing>0){
    section('Caption',[['Yes','yes',st.captions_found],['No','no',st.captions_missing]],'hasCaption');
  }
  $('sidebar').innerHTML=html;
  $('sidebar').querySelectorAll('.sb-item').forEach(el=>{
    on(el,'click',()=>{
      const k=el.dataset.k,v=el.dataset.v;
      S.filters[k]=v==='__all__'?null:v;
      applyFilters();renderSidebar();
    });
  });
}

function renderGrid(){
  const el=$('grid');
  if(!S.filtered.length){el.innerHTML='';$('gal-empty').classList.remove('hidden');return}
  $('gal-empty').classList.add('hidden');
  el.innerHTML=S.filtered.map((img,idx)=>{
    const sel=S.selected.has(img.path)?' selected':'';
    const foc=idx===S.focusIdx?' focused':'';
    const cap=img.has_caption?'<span class="thumb-cap">txt</span>':'';
    const chk=S.selected.has(img.path)?'<span class="thumb-chk">&#10003;</span>':'';
    return`<div class="thumb${sel}${foc}" data-idx="${idx}" data-path="${img.path}">
      <img src="/api/thumbnail?path=${encodeURIComponent(img.path)}" loading="lazy">
      <div class="thumb-name">${img.name}</div>${cap}${chk}</div>`;
  }).join('');
  el.querySelectorAll('.thumb').forEach(t=>{
    on(t,'click',()=>{S.focusIdx=parseInt(t.dataset.idx);renderGrid();openDetail(S.filtered[S.focusIdx])});
    on(t,'dblclick',()=>{setCompareSlot(S.filtered[parseInt(t.dataset.idx)])});
  });
}

function updateCtr(){$('ctr').textContent=`${S.filtered.length} / ${S.images.length}`}

// Detail panel
function openDetail(img){
  if(!img)return;
  S.activeImg=img;
  $('detail').classList.remove('hidden');
  $('det-title').textContent=img.name;
  $('det-img').src='/api/image?path='+encodeURIComponent(img.path);
  $('det-meta').innerHTML=`<div class="meta-row"><span class="meta-lbl">Resolution</span><span class="meta-val">${img.width}x${img.height}</span></div>
    <div class="meta-row"><span class="meta-lbl">Format</span><span class="meta-val">.${img.format}</span></div>
    <div class="meta-row"><span class="meta-lbl">Size</span><span class="meta-val">${img.size_kb} KB</span></div>`;
  $('cap-text').value=img.caption||'';
  $('save-st').textContent='';
  $('btn-cmp-det').onclick=()=>setCompareSlot(img);
}

function closeDetail(){S.activeImg=null;$('detail').classList.add('hidden')}
on($('btn-close-det'),'click',closeDetail);

async function saveCaption(){
  if(!S.activeImg)return;
  const text=$('cap-text').value;
  try{
    await api('/api/caption',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:S.activeImg.path,text})});
    S.activeImg.has_caption=!!text.trim();
    S.activeImg.caption=text;
    $('save-st').textContent='Saved';
    setTimeout(()=>$('save-st').textContent='',2000);
    renderSidebar();
  }catch(e){console.error(e)}
}
on($('btn-save'),'click',saveCaption);

on($('btn-del-det'),'click',async()=>{
  if(!S.activeImg||!confirm('Delete '+S.activeImg.name+'?'))return;
  try{
    await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({path:S.activeImg.path})});
    S.images=S.images.filter(i=>i.path!==S.activeImg.path);
    closeDetail();applyFilters();
  }catch(e){console.error(e)}
});

// Selection
function toggleSel(path){
  if(S.selected.has(path))S.selected.delete(path);
  else S.selected.add(path);
  updateSelUI();
}
function updateSelUI(){
  const n=S.selected.size;
  $('sel-ct').textContent=n;
  $('btn-del-sel').classList.toggle('hidden',n===0);
  $('btn-desel').classList.toggle('hidden',n===0);
  renderGrid();
}
on($('btn-sel-all'),'click',()=>{S.filtered.forEach(i=>S.selected.add(i.path));updateSelUI()});
on($('btn-desel'),'click',()=>{S.selected.clear();updateSelUI()});
on($('btn-del-sel'),'click',async()=>{
  if(!S.selected.size||!confirm(`Delete ${S.selected.size} images?`))return;
  const paths=[...S.selected];
  for(const p of paths){
    try{await api('/api/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})})}catch{}
  }
  S.images=S.images.filter(i=>!paths.includes(i.path));
  S.selected.clear();closeDetail();applyFilters();updateSelUI();
});

// Compare integration
function setCompareSlot(img){
  try{sessionStorage.setItem('ds_cmp_'+(S.cmpA?'b':'a'),JSON.stringify(img))}catch{}
  if(S.cmpA){location.href='/compare'}else{S.cmpA=img;alert('Image selected. Pick another and click "Compare 2", or go to Compare page.')}
}
on($('btn-cmp-sel'),'click',()=>{
  const arr=[...S.selected];
  if(arr.length!==2){alert('Select exactly 2 images');return}
  try{sessionStorage.setItem('ds_cmp_a',JSON.stringify(S.images.find(i=>i.path===arr[0])));
      sessionStorage.setItem('ds_cmp_b',JSON.stringify(S.images.find(i=>i.path===arr[1])))}catch{}
  location.href='/compare';
});

// Sorting
on($('sort-by'),'change',()=>{S.sort.by=$('sort-by').value;applyFilters()});
on($('btn-sort-dir'),'click',()=>{
  S.sort.dir=S.sort.dir==='asc'?'desc':'asc';
  $('btn-sort-dir').textContent=S.sort.dir==='asc'?'\u2191':'\u2193';
  applyFilters();
});

// Search
const searchInput=$('search');
if(searchInput){
  let searchTimer;
  on(searchInput,'input',()=>{
    clearTimeout(searchTimer);
    searchTimer=setTimeout(()=>{S.search=searchInput.value.toLowerCase();applyFilters()},200);
  });
}

// Keyboard navigation
function gridCols(){
  const items=$('grid').querySelectorAll('.thumb');if(!items.length)return 1;
  const top=items[0].getBoundingClientRect().top;
  let c=0;for(const el of items){if(el.getBoundingClientRect().top!==top)break;c++}
  return c||1;
}
function navGallery(delta){
  const n=S.filtered.length;if(!n)return;
  S.focusIdx=Math.max(0,Math.min(n-1,S.focusIdx+delta));
  renderGrid();
  const el=$('grid').querySelector('.thumb.focused');
  if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'});
  openDetail(S.filtered[S.focusIdx]);
}
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)&&e.key!=='Escape')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveCaption();return}
  if(e.key==='Escape'){if(S.activeImg){closeDetail();return}}
  if(e.key==='ArrowRight'||e.key==='l'){e.preventDefault();navGallery(1)}
  else if(e.key==='ArrowLeft'||e.key==='h'){e.preventDefault();navGallery(-1)}
  else if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();navGallery(gridCols())}
  else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();navGallery(-gridCols())}
  else if(e.key==='Enter'&&S.focusIdx>=0)openDetail(S.filtered[S.focusIdx])
  else if(e.key===' '){e.preventDefault();if(S.focusIdx>=0)toggleSel(S.filtered[S.focusIdx].path)}
  else if(e.key==='Delete'||(e.key==='Backspace'&&e.target.tagName!=='TEXTAREA')){
    if(S.selected.size>0)$('btn-del-sel').click();
    else if(S.activeImg)$('btn-del-det').click();
  }
});

// Upload (drag-drop)
const wrap=$('gal-wrap');
if(wrap){
  on(wrap,'dragover',e=>{e.preventDefault();wrap.style.background='var(--bg3)'});
  on(wrap,'dragleave',()=>wrap.style.background='');
  on(wrap,'drop',async e=>{
    e.preventDefault();wrap.style.background='';
    const files=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
    if(!files.length)return;
    for(const f of files){
      const fd=new FormData();fd.append('file',f);
      try{await fetch('/api/upload',{method:'POST',body:fd})}catch{}
    }
    location.reload();
  });
}

// Global error handlers
window.addEventListener('error',e=>console.error('[gallery global error]',e.message,'at',e.filename+':'+e.lineno));
window.addEventListener('unhandledrejection',e=>console.error('[gallery unhandled rejection]',e.reason));

// Init
console.log('[gallery] script executing');
loadAll().then(()=>console.log('[gallery] loadAll completed')).catch(e=>console.error('[gallery] loadAll threw:',e));
})();
</script>
